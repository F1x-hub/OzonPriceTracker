<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ozon Price Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" data-tab="tracking-tab">Ozon</button>
        <button class="tab-btn" data-tab="wb-tab">Wildberries</button>
        <button class="tab-btn" data-tab="history-tab">История</button>
    </div>

    <div class="container tab-content active" id="tracking-tab">
        <h2>Мониторинг цен Ozon</h2>
        
        <div class="form-group">
            <input type="url" id="productUrl" placeholder="https://www.ozon.ru/product/..." required>
        </div>
        
        <div class="form-group">
            <input type="number" id="targetPrice" placeholder="Целевая цена в рублях" min="1" required>
        </div>
        
        <div class="radio-group">
            <label>
                <input type="radio" name="priceType" value="bank" checked>
                С Ozon Банком
            </label>
            <label>
                <input type="radio" name="priceType" value="nobank">
                Без Ozon Банка
            </label>
        </div>
        
        <button id="addBtn">Добавить отслеживание</button>
        <div id="statusMessage" class="status-hidden"></div>

        <div class="settings-group" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee;">
            <label for="checkInterval" style="font-size: 13px; color: #555; display:block; margin-bottom: 5px;">Интервал проверки (минут):</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="checkInterval" min="1" value="120" style="width: 80px; box-sizing: border-box;">
                <button id="saveIntervalBtn" style="padding: 8px 10px; font-size: 13px; flex-grow: 1;">Сохранить интервал</button>
            </div>
        </div>

        <div class="tracked-items-header">
            <h3>Отслеживаемые товары</h3>
        </div>
        <div id="trackedItemsList">
            <!-- Items will be injected here by popup.js -->
        </div>

        <div class="footer">
            <span id="lastCheckTime">Последняя проверка: никогда</span>
        </div>
    </div>

    <div class="container tab-content" id="wb-tab">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 class="wb-brand-color" style="margin: 0;">Wildberries</h2>
            <div style="display: flex; gap: 5px;">
                <button id="wbExportBtn" class="wb-btn" style="padding: 5px 10px; font-size: 11px;">Excel</button>
                <button id="wbClearBtn" style="padding: 5px 10px; font-size: 11px; background-color: #6c757d;">Очистить</button>
            </div>
        </div>
        
        <div class="form-group">
            <textarea id="wbArticles" placeholder="Артикулы WB (каждый с новой строки)
Пример:
252678196
12345678" rows="6"></textarea>
        </div>
        
        <button id="wbStartBtn" class="wb-btn">Старт</button>

        <div id="wbProgressContainer" style="display: none; margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px;">
                <span id="wbProgressText">Обработано: 0 из 0</span>
                <span id="wbProgressPercent">0%</span>
            </div>
            <div style="width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden;">
                <div id="wbProgressBar" style="width: 0%; height: 100%; background: #CB11AB; transition: width 0.3s;"></div>
            </div>
        </div>

        <div class="wb-table-header">
            <span class="wb-col-article">Артикул</span>
            <span class="wb-col-price">С кошельком</span>
            <span class="wb-col-price">Без кошелька</span>
        </div>
        <div id="wbTrackedItemsList">
            <!-- WB results will be injected here -->
        </div>
    </div>

    <div class="container tab-content" id="history-tab">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0;">История уведомлений</h2>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button id="showAllHistoryBtn" style="flex-grow: 1; display: none;">Показать все</button>
            <button id="clearHistoryBtn" style="background-color: #dc3545; flex-grow: 1;">Очистить историю</button>
        </div>

        <div id="historyList">
            <!-- History items will be injected here -->
        </div>
    </div>

    <script src="xlsx.full.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
